version: 1
project:
  title: Blog Pessoal do Victor Costa
  authors:
    - name: João Victor Costa Pereira
  copyright: '2026'
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
    - generate_rss.py
    - inject_comments.py
    - rss.xml
    - atom.xml
    - CONDUCT.md
    - CONTRIBUTING.md
    - README.md
  github: victorgitcosta/personal_blog
  thebe:
    binder:
      repo: opengeos/myst-website-template
      provider: github
      url: https://mybinder.org
      ref: main
  bibliography:
    - pages/references.bib
  toc: #table of contents
    - file: index.md
    - file: blog.md
      children:
        - file: tags/myst-markdown.md
        - file: tags/tutorial.md
        - file: tags/github-pages.md
    - pattern: posts/*.md
      hidden: true
site:
  options:
    logo: logo.png
    logo_dark: logo.png
    favicon: fav.ico
    folders: true
    style: custom.css
    #style can me commented to add personal styling
    # analytics_google: G-XXX
  actions:
    - title: RSS
      url: https://opengeos.org/myst-website-template/rss.xml
  template: book-theme
  parts:
    primary_sidebar_footer: ''
